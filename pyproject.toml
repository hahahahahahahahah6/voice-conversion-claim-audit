[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-conversion-claim-audit"
version = "0.1.0"
description = "Local documentation promise checker"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
voice-conversion-claim-audit = "voice_conversion_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["voice_conversion_claim_audit*", "tests"]
